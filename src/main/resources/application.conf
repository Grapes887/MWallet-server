ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.ApplicationKt.rootModule ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/payment_db"
    url = ${?DATABASE_URL}
    user = "admin"
    user = ${?DATABASE_USER}
    password = "secret_password"
    password = ${?DATABASE_PASSWORD}
}

firebase {
    # Путь к JSON ключу сервисного аккаунта из Firebase Console
    credentials = "firebase-service-account.json"
    credentials = ${?FIREBASE_CREDENTIALS}
}
